<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc">
  <title id="title">Week 7 proposed six-angle specimen fixture</title>
  <desc id="desc">Concept only: stationary specimen with manual indexing at zero, sixty, one hundred twenty, one hundred eighty, two hundred forty and three hundred degrees. Proposed bright-field and dark-field channels require physical validation. USB camera connects to Raspberry Pi; STM32 lighting and independent sensing interfaces remain proposed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#37546c"/></marker>
    <marker id="lightArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bb791c"/></marker>
    <style>
      text {font-family: Arial, Helvetica, sans-serif; fill:#20364b; font-size:17px}
      .title {font-size:29px; font-weight:700}
      .heading {font-size:21px; font-weight:700}
      .label {font-size:18px; font-weight:700}
      .small {font-size:15px}
      .tiny {font-size:14px}
      .muted {fill:#536b7c}
      .panel {fill:#fff; stroke:#ccd6df; stroke-width:1.5}
      .hardware {fill:#e5edf4; stroke:#426178; stroke-width:2}
      .proposed {fill:#fcf3df; stroke:#bb791c; stroke-width:2; stroke-dasharray:7 5}
      .line {fill:none; stroke:#37546c; stroke-width:2; marker-end:url(#arrow)}
      .light {fill:none; stroke:#bb791c; stroke-width:2; stroke-dasharray:7 5; marker-end:url(#lightArrow)}
      .leader {fill:none; stroke:#6b8293; stroke-width:1.5}
      .axis {fill:none; stroke:#648099; stroke-width:1.5; stroke-dasharray:9 5}
    </style>
  </defs>
  <rect width="1400" height="1080" fill="#f3f6f9"/>
  <text class="title" x="40" y="48">Week 7 | Fixed specimen, manual six-angle indexing</text>
  <rect x="1055" y="23" width="305" height="37" rx="7" fill="#f7e7c1"/>
  <text class="label" x="1073" y="48">PROPOSED_INTERFACE</text>
  <text class="muted" x="40" y="80">Concept for review • No measured dimensions • Fabrication drawings and physical acceptance pending</text>

  <rect class="panel" x="30" y="108" width="830" height="553" rx="12"/>
  <text class="heading" x="52" y="143">A. Mechanical and imaging relationship</text>
  <text class="small muted" x="52" y="170">Geometry is illustrative; mounts, optics and light positions require delivered-hardware checks.</text>

  <rect class="hardware" x="369" y="205" width="156" height="74" rx="8"/>
  <text class="label" x="388" y="234">ALC-IMX258</text>
  <text class="small" x="389" y="257">USB camera</text>
  <rect class="hardware" x="419" y="279" width="56" height="34" rx="4"/>
  <line class="line" x1="447" y1="320" x2="447" y2="458"/>
  <text class="small" x="462" y="365">View direction</text>
  <text class="small muted" x="462" y="389">Focus, then lock</text>
  <path class="leader" d="M525 230H583V204H813"/>
  <text class="small" x="580" y="195">Adjustable mount: dimensions TBD</text>

  <rect class="proposed" x="70" y="229" width="234" height="83" rx="7"/>
  <text class="label" x="88" y="256">Bright-field channel</text>
  <text class="small" x="88" y="280">Placement / optics TBD</text>
  <path class="light" d="M258 314L394 453"/>
  <rect class="proposed" x="590" y="313" width="226" height="82" rx="7"/>
  <text class="label" x="608" y="341">Dark-field channel</text>
  <text class="small" x="608" y="365">Placement / optics TBD</text>
  <path class="light" d="M620 399L500 458"/>

  <rect x="77" y="523" width="737" height="24" rx="4" fill="#d1dce5" stroke="#70889b"/>
  <rect class="hardware" x="119" y="441" width="91" height="82" rx="7"/>
  <rect class="hardware" x="681" y="441" width="91" height="82" rx="7"/>
  <rect x="145" y="459" width="600" height="15" rx="7" fill="#8caba3" stroke="#42685f" stroke-width="2"/>
  <rect x="314" y="441" width="264" height="52" rx="5" fill="none" stroke="#358d75" stroke-width="2" stroke-dasharray="5 4"/>
  <line class="axis" x1="55" y1="467" x2="839" y2="467"/>
  <text class="small" x="325" y="430">Visible inspection segment</text>
  <text class="small" x="90" y="572">End holder</text>
  <path class="leader" d="M164 553V534"/>
  <text class="small" x="618" y="572">Manual index + lock</text>
  <path class="leader" d="M726 553V534"/>
  <text class="small" x="318" y="572">Specimen longitudinal axis</text>
  <text class="small muted" x="67" y="609">Lock the angle and specimen before each exposure. Preserve the same marked segment.</text>
  <text class="small muted" x="67" y="635">Light arrows show candidate channels only; they do not validate an optical mode.</text>

  <rect class="panel" x="880" y="108" width="490" height="553" rx="12"/>
  <text class="heading" x="902" y="143">B. Index dial: end-view concept</text>
  <text class="small muted" x="902" y="170">Relative dial orientation; establish the physical zero.</text>
  <circle cx="1125" cy="351" r="126" fill="#f1f6fa" stroke="#426178" stroke-width="3"/>
  <circle cx="1125" cy="351" r="48" fill="#e2ece8" stroke="#42685f" stroke-width="2"/>
  <circle cx="1125" cy="351" r="9" fill="#42685f"/>
  <line class="axis" x1="985" y1="351" x2="1265" y2="351"/>
  <line class="axis" x1="1125" y1="211" x2="1125" y2="492"/>
  <line x1="1125" y1="225" x2="1125" y2="241" stroke="#20364b" stroke-width="4"/>
  <line x1="1234" y1="288" x2="1220" y2="296" stroke="#20364b" stroke-width="4"/>
  <line x1="1234" y1="414" x2="1220" y2="406" stroke="#20364b" stroke-width="4"/>
  <line x1="1125" y1="477" x2="1125" y2="461" stroke="#20364b" stroke-width="4"/>
  <line x1="1016" y1="414" x2="1030" y2="406" stroke="#20364b" stroke-width="4"/>
  <line x1="1016" y1="288" x2="1030" y2="296" stroke="#20364b" stroke-width="4"/>
  <text class="label" x="1113" y="211">0°</text>
  <text class="label" x="1244" y="286">60°</text>
  <text class="label" x="1244" y="434">120°</text>
  <text class="label" x="1101" y="510">180°</text>
  <text class="label" x="948" y="434">240°</text>
  <text class="label" x="948" y="286">300°</text>
  <path d="M1125 216L1117 199H1133Z" fill="#bb791c" transform="translate(0,-27)"/>
  <path class="leader" d="M1144 191H1308"/>
  <text class="tiny" x="1164" y="183">Fixed reference pointer</text>
  <text class="tiny" x="1081" y="330">End holder</text>
  <path class="leader" d="M1138 362L1190 391H1311"/>
  <text class="tiny" x="1195" y="385">Specimen axis</text>
  <text class="small" x="913" y="549">6 angles × 2 lighting modes = 12 branches</text>
  <text class="small muted" x="913" y="579">At each angle: bright field → OFF</text>
  <text class="small muted" x="913" y="602">then dark field → OFF → manual next angle.</text>
  <text class="small muted" x="913" y="634">Angle accuracy / repeatability: not measured.</text>

  <rect class="panel" x="30" y="681" width="1340" height="309" rx="12"/>
  <text class="heading" x="52" y="718">C. Functional interface map — proposed, not a wiring diagram</text>
  <text class="small muted" x="52" y="743">Pins, ADC channels, drivers, supply ratings and real communication transport await hardware confirmation.</text>

  <rect class="hardware" x="60" y="779" width="168" height="71" rx="7"/>
  <text class="label" x="77" y="808">USB camera</text>
  <text class="small" x="77" y="833">ALC-IMX258</text>
  <rect class="hardware" x="325" y="779" width="174" height="71" rx="7"/>
  <text class="label" x="344" y="808">Raspberry Pi</text>
  <text class="small" x="344" y="833">Capture / records</text>
  <path class="line" d="M232 814H319"/>
  <text class="small" x="256" y="797">USB</text>

  <rect class="proposed" x="637" y="779" width="178" height="71" rx="7"/>
  <text class="label" x="660" y="808">STM32</text>
  <text class="small" x="660" y="833">Lighting / status</text>
  <path class="line" d="M505 805H631"/>
  <path class="line" d="M631 826H505"/>
  <text class="tiny" x="507" y="770">Command / heartbeat</text>
  <text class="tiny" x="515" y="873">Correlated status</text>

  <rect class="proposed" x="926" y="779" width="178" height="71" rx="7"/>
  <text class="label" x="946" y="808">Driver: TBD</text>
  <text class="small" x="946" y="833">Mode / OFF</text>
  <path class="line" d="M820 814H920"/>
  <text class="tiny" x="829" y="800">Control</text>
  <rect class="proposed" x="1178" y="779" width="164" height="71" rx="7"/>
  <text class="label" x="1194" y="808">Light channels</text>
  <text class="small" x="1194" y="833">Optics: TBD</text>
  <path class="line" d="M1110 814H1172"/>

  <rect class="proposed" x="60" y="891" width="242" height="70" rx="7"/>
  <text class="label" x="77" y="919">Material-present input</text>
  <text class="small" x="77" y="944">Independent sensing</text>
  <path class="line" d="M308 927H675V856"/>
  <rect class="proposed" x="925" y="891" width="270" height="70" rx="7"/>
  <text class="label" x="944" y="919">Illumination reference input</text>
  <text class="small" x="944" y="944">Independent sensing</text>
  <path class="line" d="M919 927H780V856"/>
  <text class="tiny muted" x="350" y="954">Input types, units and thresholds: TBD</text>

  <text class="small" x="40" y="1021">Current software evidence: OFFLINE_SYNTHETIC_ONLY. No serial connection or physical output is implemented by the simulator.</text>
  <text class="small muted" x="40" y="1048">To confirm after delivery: mounting dimensions, focus lock, indexing, optical contrast, independent sensing and calibration evidence.</text>
</svg>
